<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Parity Visual Evidence — 538b97d</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #0a0a0a;
      color: #fff;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    .meta {
      color: #888;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .studio {
      margin-bottom: 40px;
    }
    .studio h2 {
      font-size: 18px;
      margin-bottom: 12px;
      color: #22d3ee;
    }
    .screenshots {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    .screenshot {
      background: #111;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #222;
    }
    .screenshot img {
      width: 100%;
      height: auto;
      display: block;
    }
    .caption {
      padding: 8px 12px;
      font-size: 12px;
      color: #aaa;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      margin-right: 6px;
    }
    .badge-desktop { background: #22d3ee; color: #000; }
    .badge-mobile { background: #ebff66; color: #000; }
    .badge-local { background: #666; color: #fff; }
    .badge-production { background: #4ade80; color: #000; }
  </style>
</head>
<body>
  <h1>Studio Parity Visual Evidence</h1>
  <div class="meta">
    Deployed commit: <code>538b97d28fdeb5958e9aa03951b9aa661d12d684</code> |
    Parity commit: <code>207ff6fbed0edfafb9ba3638edafb29d2a236ba1</code> |
    Production: <a href="https://go.smartvid.app" style="color:#22d3ee">https://go.smartvid.app</a> |
    Generated: 2026-09-11T18:30:00.000Z |
    Total screenshots: 117 (85 desktop, 32 mobile)
  </div>

  <div id="studios"></div>

  <script>
    const studios = [
      { slug: 'image', label: 'Image Studio', route: '/studio/image' },
      { slug: 'video', label: 'Video Studio', route: '/studio/video' },
      { slug: 'audio', label: 'Audio Studio', route: '/studio/audio' },
      { slug: 'clipping', label: 'Clipping Studio', route: '/studio/clipping' },
      { slug: 'vibe-motion', label: 'Vibe Motion Studio', route: '/studio/vibe-motion' },
      { slug: 'lipsync', label: 'Lip Sync Studio', route: '/studio/lipsync' },
      { slug: 'cinema', label: 'Cinema Studio', route: '/studio/cinema' },
      { slug: 'marketing', label: 'Marketing Studio', route: '/studio/marketing' },
      { slug: 'recast', label: 'Recast Studio', route: '/studio/recast' },
      { slug: 'layers', label: 'Layers Studio', route: '/studio/layers' },
      { slug: 'workflows', label: 'Workflow Studio', route: '/studio/workflows' },
      { slug: 'agents', label: 'Agent Studio', route: '/studio/agents' },
      { slug: 'design-agent', label: 'Design Agent Studio', route: '/studio/design-agent' },
      { slug: 'ai-influencer', label: 'AI Influencer Studio', route: '/studio/ai-influencer' },
    ];

    const container = document.getElementById('studios');

    for (const studio of studios) {
      const section = document.createElement('div');
      section.className = 'studio';

      const title = document.createElement('h2');
      title.textContent = `${studio.label} — ${studio.route}`;
      section.appendChild(title);

      const grid = document.createElement('div');
      grid.className = 'screenshots';

      ['desktop', 'mobile'].forEach(view => {
        const file = `visual-assets/parity-evidence-538b97d/${view}/${studio.slug}/01-studio-overview.png`;
        const item = document.createElement('div');
        item.className = 'screenshot';
        item.innerHTML = `
          <img src="${file}" alt="${studio.label} ${view} overview" loading="lazy" onerror="this.style.display='none'">
          <div class="caption">
            <span class="badge badge-${view}">${view}</span>
            <span class="badge badge-local">LOCAL EVIDENCE ONLY</span>
            ${studio.label} — ${view} overview
          </div>
        `;
        grid.appendChild(item);
      });

      section.appendChild(grid);
      container.appendChild(section);
    }
  </script>
</body>
</html>
