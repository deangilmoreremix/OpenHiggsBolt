# Supabase project configuration
# Docs: https://supabase.com/docs/guides/cli/config
# Linked project ref: bzxohkrxcwodllketcpz (VideoRemix Product)
project_id = "bzxohkrxcwodllketcpz"

[functions.weekend-bonus-3pay-webhook]
# Stripe webhook endpoint. Security is enforced via Stripe webhook signature
# verification (STRIPE_3PAY_WEBHOOK_SECRET), not JWT.
verify_jwt = false

[functions.enhance-prompt]
# Called from the browser (src/shared/api/openai.ts) with no Supabase JWT.
verify_jwt = false

[functions.brand-analyze]
# Called server-to-server by netlify/functions/brands.js (never from the
# browser). No Supabase JWT is ever issued for this call, so JWT verification
# is off; access is gated instead by the shared internal service token — the
# function requires `x-internal-service-token` to equal INTERNAL_FUNCTION_SECRET
# and returns 401 UNAUTHORIZED otherwise. Direct public calls are rejected.
verify_jwt = false

[functions.campaign-generate]
# Called server-to-server by netlify/functions/campaigns.js. No Supabase JWT
# is issued for this call; access is gated by the shared internal service token
# (`x-internal-service-token` = INTERNAL_FUNCTION_SECRET, 401 UNAUTHORIZED
# otherwise). Direct public calls are rejected.
verify_jwt = false

[functions.asset-generate]
# Called server-to-server by netlify/functions/assets.js. No Supabase JWT is
# issued for this call; access is gated by the shared internal service token
# (`x-internal-service-token` = INTERNAL_FUNCTION_SECRET, 401 UNAUTHORIZED
# otherwise). Direct public calls are rejected.
verify_jwt = false

[functions.photo-studio]
# Called server-to-server by netlify/functions/photo-studio.js. No Supabase JWT
# is issued for this call; access is gated by the shared internal service token
# (`x-internal-service-token` = INTERNAL_FUNCTION_SECRET, 401 UNAUTHORIZED
# otherwise). Direct public calls are rejected.
verify_jwt = false
