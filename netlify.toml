[build]
  # Build all workspace packages whose dist/ is gitignored and must be
  # generated before the root Next.js build can resolve them.
  # pnpm, not npm: the repo's packageManager is pnpm, the dependency tree is
  # pnpm-lock.yaml, and only pnpm applies the patchedDependencies in
  # pnpm-workspace.yaml. Under npm that patch is never applied and the prebuild
  # guard exits 1, which is why every Netlify-side build failed with a bare
  # "Build script returned non-zero exit code". Commit 4d6631bee fixed this and
  # 7e8a436b3 reverted it; this restores the fix.
  # The Vibe-Workflow submodule was removed (the workflow editor now lives in
  # packages/workflow-builder), but Netlify's build area can still hold the old
  # folder from earlier builds, and its secret scan then finds a real key in
  # packages/Vibe-Workflow/server/.env.example. Delete it before anything else;
  # this is a no-op on a clean checkout.
  command = "rm -rf packages/Vibe-Workflow && pwd && ls -la && rm -rf node_modules/electron/dist && set -x && pnpm run build:metadata && pnpm run build:packages && pnpm run build"
  publish = ".next"
  exclude = ["electron/dist/**", "playwright/**", "src/**", "index.html", "vite.svg", "public/vite.svg", "electron/**", "*.md", "!public/**", ".next/cache/**"]

  [build.environment]
    # `next build` of this app peaks at ~4.7 GB RSS (measured locally, 3 min). Node's default heap limit (~2 GB)
    # makes webpack die with "JavaScript heap out of memory" (exit 134) once the dependency graph is this large,
    # which Netlify reports only as "Build script returned non-zero exit code". Give it headroom.
    NODE_OPTIONS = "--max-old-space-size=6144"
    # Ensure build-time dependencies (tailwindcss, autoprefixer, jsdom, babel, etc.)
    # are installed even if the build image sets NODE_ENV=production.
    NPM_CONFIG_PRODUCTION = "false"
    # Skip Playwright browser downloads during install to avoid network/timeouts.
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
    # Skip Electron binary download on CI/Netlify; this app does not use Electron in production.
    ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
    # Match local development Node version.
    NODE_VERSION = "22"
    # Allow pnpm to run ignored build scripts for electron, esbuild, sharp, unrs-resolver
    PNPM_ALLOW_BUILD_SCRIPTS = "electron,esbuild,sharp,unrs-resolver"
    PNPM_IGNORE_BUILDS = "false"
    # Use shallow submodule clones (depth=1) to avoid fetching historical commits
    # that reference invalid submodule commits (e.g., 36bdba26ae36a5cc73e6c2cb8e5ec5759d98f741)
    GIT_SUBMODULE_DEPTH = "1"

[site]
  site_id = "76f606a3-8546-440f-8469-33a0236a8a23"

[[headers]]
  for = "/*"
  [headers.values]
    # Allow Clerk (served from the instance domain, a different origin than the app)
    # and Google Fonts. Without this the Netlify Essential Next.js plugin's default
    # CSP blocks Clerk's JS/CSS/API and leaves /sign-in, /sign-up and the password-reset
    # pages blank.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://clerk.go.smartvid.app https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://clerk.go.smartvid.app https://fonts.googleapis.com; worker-src 'self' blob:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://clerk.go.smartvid.app https://api.clerk.com https://muapi.ai https://*.muapi.ai https://*.supabase.co https://www.remotion.pro https://huggingface.co https://*.hf.co https://cdn.jsdelivr.net; font-src 'self' data: https://clerk.go.smartvid.app https://fonts.gstatic.com;"

[[plugins]]
  package = "@netlify/plugin-nextjs"


[[redirects]]
  from = "/api/brands"
  to = "/.netlify/functions/brands"
  status = 200

[[redirects]]
  from = "/api/brand"
  to = "/.netlify/functions/brand"
  status = 200

[[redirects]]
  from = "/api/campaigns"
  to = "/.netlify/functions/campaigns"
  status = 200

[[redirects]]
  from = "/api/assets"
  to = "/.netlify/functions/assets"
  status = 200

[[redirects]]
  from = "/api/photo-studio"
  to = "/.netlify/functions/photo-studio"
  status = 200
