[build]
  # ai-agent is a local file dependency (git submodule) whose dist/ is
  # gitignored and must be built before next build can resolve it.
  command = "npm run build:agent && npm run build"
  publish = ".next"

[[headers]]
  for = "/*"
  [headers.values]
    # Allow Clerk (served from the instance domain, a different origin than the app)
    # and Google Fonts. Without this the Netlify Essential Next.js plugin's default
    # CSP blocks Clerk's JS/CSS/API and leaves /sign-in, /sign-up and the password-reset
    # pages blank.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://clerk.go.smartvid.app https://touched-stud-74.clerk.accounts.dev; style-src 'self' 'unsafe-inline' https://clerk.go.smartvid.app https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://clerk.go.smartvid.app https://touched-stud-74.clerk.accounts.dev https://api.clerk.com https://muapi.ai https://*.muapi.ai https://*.supabase.co; font-src 'self' data: https://clerk.go.smartvid.app https://fonts.gstatic.com;"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/brands"
  to = "/.netlify/functions/brands"
  status = 200

[[redirects]]
  from = "/api/brand"
  to = "/.netlify/functions/brand"
  status = 200

[[redirects]]
  from = "/api/campaigns"
  to = "/.netlify/functions/campaigns"
  status = 200

[[redirects]]
  from = "/api/assets"
  to = "/.netlify/functions/assets"
  status = 200

[[redirects]]
  from = "/api/photo-studio"
  to = "/.netlify/functions/photo-studio"
  status = 200
