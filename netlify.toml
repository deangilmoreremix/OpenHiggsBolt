[build]
  # Build all workspace packages whose dist/ is gitignored and must be
  # generated before the root Next.js build can resolve them.
  command = "pwd && ls -la && rm -rf node_modules/electron/dist && set -x && npm run build:metadata && npm run build:packages && npm run build"
  publish = ".next"
  exclude = ["electron/dist/**", "playwright/**", "src/**", "index.html", "vite.svg", "public/vite.svg", "electron/**", "*.md", "!public/**", ".next/cache/**"]

  [build.environment]
    # Ensure build-time dependencies (tailwindcss, autoprefixer, jsdom, babel, etc.)
    # are installed even if the build image sets NODE_ENV=production.
    NPM_CONFIG_PRODUCTION = "false"
    # Skip Playwright browser downloads during install to avoid network/timeouts.
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
    # Skip Electron binary download on CI/Netlify; this app does not use Electron in production.
    ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
    # Match local development Node version.
    NODE_VERSION = "22"
    # Allow pnpm to run ignored build scripts for electron, esbuild, sharp, unrs-resolver
    PNPM_ALLOW_BUILD_SCRIPTS = "electron,esbuild,sharp,unrs-resolver"
    PNPM_IGNORE_BUILDS = "false"
    # Use shallow submodule clones (depth=1) to avoid fetching historical commits
    # that reference invalid submodule commits (e.g., 36bdba26ae36a5cc73e6c2cb8e5ec5759d98f741)
    GIT_SUBMODULE_DEPTH = "1"

[site]
  site_id = "76f606a3-8546-440f-8469-33a0236a8a23"

# The Next.js SSR handler is packaged by @netlify/plugin-nextjs into
# .netlify/functions-internal/___netlify-server-handler, and the plugin writes a
# per-function config (___netlify-server-handler.json) asking for
# node_bundler = "none" plus included_files = ["**"] so the whole traced server
# is shipped with the function.
#
# That per-function config is not always honoured on the deploy path: the CLI
# re-zips the function with the config from this file, and when the resulting
# bundler is "nft" (which runtimeAPIVersion 2 forces unless node_bundler is
# explicitly "none") the function is bundled down to 5 files. The deployed
# function then has no run-config.json, so the Lambda aborts with
# "ENOENT: no such file or directory, open '/run-config.json'" and every SSR
# route answers 502.
#
# Declaring the bundler and the included files here makes the packaging
# deterministic: the handler always ships its run-config.json, .next output and
# traced node_modules.
[functions."___netlify-server-handler"]
  node_bundler = "none"
  included_files = [".netlify/functions-internal/___netlify-server-handler/**"]

[[headers]]
  for = "/*"
  [headers.values]
    # Allow Clerk (served from the instance domain, a different origin than the app)
    # and Google Fonts. Without this the Netlify Essential Next.js plugin's default
    # CSP blocks Clerk's JS/CSS/API and leaves /sign-in, /sign-up and the password-reset
    # pages blank.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://clerk.go.smartvid.app; style-src 'self' 'unsafe-inline' https://clerk.go.smartvid.app https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://clerk.go.smartvid.app https://api.clerk.com https://muapi.ai https://*.muapi.ai https://*.supabase.co https://www.remotion.pro; font-src 'self' data: https://clerk.go.smartvid.app https://fonts.gstatic.com;"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/brands"
  to = "/.netlify/functions/brands"
  status = 200

[[redirects]]
  from = "/api/brand"
  to = "/.netlify/functions/brand"
  status = 200

[[redirects]]
  from = "/api/campaigns"
  to = "/.netlify/functions/campaigns"
  status = 200

[[redirects]]
  from = "/api/assets"
  to = "/.netlify/functions/assets"
  status = 200

[[redirects]]
  from = "/api/photo-studio"
  to = "/.netlify/functions/photo-studio"
  status = 200
