name: Electron Desktop Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-electron:
    name: Build Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/*/package.json
            apps/*/package.json
            apps/*/*/package.json
            packages/*/*/package.json
            packages/*/*/*/package.json

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Install dependencies (npm ci, fallback to install)
        run: |
          if npm ci --no-audit --prefer-offline; then
            echo "npm ci succeeded"
          else
            echo "npm ci failed, falling back to npm install"
            npm install --no-audit --prefer-offline
          fi

      - name: Run setup (submodule build)
        run: npm run setup || true

      - name: Vite build (renderer)
        run: npm run vite:build

      - name: Stage local AI binary
        run: npm run stage:local-ai || true
        continue-on-error: true

      - name: Build Electron (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --publish never

      - name: Build Electron (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      - name: Build Electron (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never

      - name: Package Linux .deb
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: npm run package:linux:deb || true

      - name: Upload Electron release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}-${{ github.run_id }}
          path: |
            release/
            release/**/*.exe
            release/**/*.dmg
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.zip
            release/**/*.blockmap
            release/**/*.yml
          if-no-files-found: ignore
          retention-days: 14
