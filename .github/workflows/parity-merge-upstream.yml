name: Protected Upstream Parity Merge

on:
  push:
    branches:
      - parity/upstream-full-2026-09-02
    paths:
      - .github/workflows/parity-merge-upstream.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parity-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout parity branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          ref: parity/upstream-full-2026-09-02

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/Anil-matcha/Open-Generative-AI.git
          git fetch upstream main --tags
          echo "UPSTREAM_SHA=$(git rev-parse upstream/main)" >> "$GITHUB_ENV"
          echo "PRE_MERGE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Merge upstream while preserving local conflict regions
        shell: bash
        run: |
          set +e
          git merge --no-ff --no-commit -X ours upstream/main
          merge_exit=$?
          set -e

          if [ "$merge_exit" -ne 0 ]; then
            echo "Automatic merge left conflicts. Resolving structural conflicts conservatively."
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for path in "${conflicts[@]}"; do
              if git ls-files -u -- "$path" | awk '$3==2 {found=1} END{exit !found}'; then
                echo "Keeping local version for conflict: $path"
                git checkout --ours -- "$path" || true
              else
                echo "Local side has no file; accepting upstream addition: $path"
                git checkout --theirs -- "$path" || true
              fi
              git add -A -- "$path"
            done
          fi

          while IFS=$'\t' read -r status path rest; do
            if [ "$status" = "D" ]; then
              echo "Restoring locally-existing file deleted by upstream merge: $path"
              git checkout "$PRE_MERGE_SHA" -- "$path"
              git add -- "$path"
            fi
          done < <(git diff --name-status "$PRE_MERGE_SHA")

      - name: Protect SmartVideo-specific integrations
        shell: bash
        run: |
          set -e
          protect_file() {
            file="$1"; shift
            if [ ! -f "$file" ]; then
              echo "Protected file missing after merge; restoring: $file"
              git checkout "$PRE_MERGE_SHA" -- "$file"
              git add "$file"
              return
            fi
            for marker in "$@"; do
              if ! grep -Fq "$marker" "$file"; then
                echo "Protected marker '$marker' disappeared from $file; restoring local version"
                git checkout "$PRE_MERGE_SHA" -- "$file"
                git add "$file"
                return
              fi
            done
          }

          protect_file components/StandaloneShell.js \
            "SocialPublishProvider" "AiAssistantProvider" "GoAiViralStudio" \
            "Storyboard" "ThumbnailStudio" "VFXStudio" "templateData" "useAuthConfig"

          protect_file packages/studio/src/components/VideoStudio.jsx \
            "PublishStep" "AssistStep" "readStoryboardHandoff" "templateData"

          protect_file packages/studio/src/components/VideoStudioParity.jsx \
            "PublishStep" "AssistStep" "readStoryboardHandoff" "UniversalMediaUploader" \
            "videoWorkflows.js" "templateData"

          protect_file packages/studio/src/components/UniversalMediaUploader.jsx \
            "role" "uploadFile" "drag"

          protect_file packages/studio/src/components/ImageStudio.jsx \
            "PublishStep" "AssistStep" "templateData"

          protect_file packages/studio/src/models.js "getModesForModel"
          protect_file src/lib/authConfig.ts "getApiKey" "setApiKey"

          grep -Fq "./components/VideoStudioParity" packages/studio/src/index.js || {
            echo "Active parity VideoStudio export disappeared; restoring local index"
            git checkout "$PRE_MERGE_SHA" -- packages/studio/src/index.js
            git add packages/studio/src/index.js
          }

          for path in \
            src/apps/go-ai-viral/GoAiViralStudio.tsx \
            src/apps/storyboard/Storyboard.tsx \
            src/apps/thumbnail-studio/ThumbnailStudio.tsx \
            src/apps/vfx-studio/VFXStudio.tsx \
            components/SocialPublishProvider.tsx \
            components/AiAssistantProvider.tsx; do
            test -e "$path" || { echo "Required SmartVideo feature missing: $path"; exit 1; }
          done

      - name: Verify upstream parity components were added
        shell: bash
        run: |
          set -e
          required=(
            packages/studio/src/components/AppsStudio.jsx
            packages/studio/src/components/LayersStudio.jsx
            packages/studio/src/components/MobileGenerationActions.jsx
            packages/studio/src/components/ModelParameterControls.jsx
            packages/studio/src/components/UniversalMediaUploader.jsx
            packages/studio/src/components/VideoStudioParity.jsx
            packages/studio/src/components/prompt/PromptComposer.jsx
            packages/studio/src/utils/formatError.js
            packages/studio/src/utils/downloadImage.js
            packages/studio/src/i18nUtils.js
            lib/locales.js
            messages/en/common.json
            messages/zh/common.json
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required upstream parity file: $path"; exit 1; }
          done

          for locale in en zh; do
            for bundle in agentStudio aiInfluencerStudio appsStudio audioStudio cinemaStudio clippingStudio imageStudio layersStudio lipSyncStudio marketingStudio mcpCliStudio recastStudio vibeMotionStudio videoStudio; do
              test -f "packages/studio/src/messages/$locale/$bundle.json" || {
                echo "Missing locale bundle: $locale/$bundle.json"; exit 1;
              }
            done
          done

      - name: Record upstream sync point
        run: |
          printf '%s\n' "$UPSTREAM_SHA" > .upstream-sync
          git add .upstream-sync

      - name: Commit protected merge
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No merge changes to commit."
          else
            git commit -m "merge(parity): integrate upstream main without removing SmartVideo features"
          fi

      - name: Initialize submodules
        continue-on-error: true
        run: git submodule update --init --recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Build studio package
        id: studio_build
        continue-on-error: true
        run: npm run build:studio

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: npm run test:unit

      - name: Model parity checker
        id: model_parity
        continue-on-error: true
        run: node scripts/model-diff-checker.mjs

      - name: Generate parity merge report
        shell: bash
        run: |
          mkdir -p docs/audits
          {
            echo "# Protected Upstream Parity Merge — 2026-09-02"
            echo
            echo "- Pre-merge local: \`$PRE_MERGE_SHA\`"
            echo "- Upstream merged: \`$UPSTREAM_SHA\`"
            echo "- Branch: \`parity/upstream-full-2026-09-02\`"
            echo "- Strategy: Git three-way merge; local side wins direct conflicts; upstream-only additions accepted; local file deletions prohibited."
            echo
            echo "## Validation"
            echo
            echo "| Check | Outcome |"
            echo "|---|---|"
            echo "| npm ci | ${{ steps.install.outcome }} |"
            echo "| Studio build | ${{ steps.studio_build.outcome }} |"
            echo "| Typecheck | ${{ steps.typecheck.outcome }} |"
            echo "| Unit tests | ${{ steps.unit_tests.outcome }} |"
            echo "| Model parity checker | ${{ steps.model_parity.outcome }} |"
            echo
            echo "## SmartVideo protection assertions"
            echo
            echo "Protected shell/provider, active parity Video Studio, UniversalMediaUploader, templateData, storyboard handoff, GO-Viral, VFX, Thumbnail Studio, Storyboard, centralized auth, and local model-helper markers were verified after merge."
            echo
            echo "## Remaining content differences vs upstream"
            echo
            echo '```'
            git diff --stat upstream/main HEAD || true
            echo '```'
            echo
            echo "Differences may be intentional SmartVideo additions. Shared files that remain local require semantic review, not blind replacement."
          } > docs/audits/UPSTREAM-PARITY-MERGE-2026-09-02.md
          git add docs/audits/UPSTREAM-PARITY-MERGE-2026-09-02.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(parity): record protected upstream merge validation"
          fi

      - name: Push parity branch
        run: git push origin HEAD:parity/upstream-full-2026-09-02
