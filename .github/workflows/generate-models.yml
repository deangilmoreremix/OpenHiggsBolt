name: Generate models.js

on:
  push:
    paths:
      - 'models_dump.json'
      - 'packages/studio/src/models.js'
      - 'scripts/generate-models.mjs'
      - '.github/workflows/generate-models.yml'
  pull_request:
    paths:
      - 'models_dump.json'
      - 'packages/studio/src/models.js'
      - 'scripts/generate-models.mjs'
      - '.github/workflows/generate-models.yml'

permissions:
  contents: read

jobs:
  generate-models:
    name: Regenerate models.js from models_dump.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The generator (scripts/generate-models.mjs) is dependency-free and uses
      # only Node.js built-ins, so no `npm install` of the project is required.
      - name: Regenerate models.js
        run: npm run gen:models

      - name: Verify models.js is up to date
        run: git diff --exit-code packages/studio/src/models.js
