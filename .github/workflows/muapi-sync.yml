name: MUAPI Catalog Sync

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      emit:
        description: 'Update models.js with new entries'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      health_check:
        description: 'Run health check on endpoints'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  NODE_VERSION: '20'

jobs:
  # ─── Job 1: Fetch catalog and detect changes ─────────────────────────────
  sync:
    name: Fetch & Detect Changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      added: ${{ steps.detect.outputs.added }}
      removed: ${{ steps.detect.outputs.removed }}
      modified: ${{ steps.detect.outputs.modified }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Fetch catalog and detect changes
        id: detect
        run: |
          node scripts/muapi-catalog-sync.mjs --health-check 2>&1 | tee sync-output.log
          
          # Parse output for changes
          ADDED=$(grep -oP 'Added: \K\d+' sync-output.log || echo "0")
          REMOVED=$(grep -oP 'Removed: \K\d+' sync-output.log || echo "0")
          MODIFIED=$(grep -oP 'Modified: \K\d+' sync-output.log || echo "0")
          
          echo "added=$ADDED" >> $GITHUB_OUTPUT
          echo "removed=$REMOVED" >> $GITHUB_OUTPUT
          echo "modified=$MODIFIED" >> $GITHUB_OUTPUT
          
          if [ "$ADDED" -gt 0 ] || [ "$REMOVED" -gt 0 ] || [ "$MODIFIED" -gt 0 ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload catalog artifacts
        uses: actions/upload-artifact@v4
        with:
          name: catalog-${{ github.run_number }}
          path: |
            catalogs/
          retention-days: 30

  # ─── Job 2: Create PR with updates ───────────────────────────────────────
  create-pr:
    name: Create Sync PR
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event.inputs.emit == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download catalog artifacts
        uses: actions/download-artifact@v4
        with:
          name: catalog-${{ github.run_number }}
          path: catalogs/

      - name: Update models.js with new entries
        run: |
          node scripts/muapi-catalog-sync.mjs --emit

      - name: Run verification
        run: |
          node scripts/verify-muapi-apis.mjs

      - name: Run tests
        run: |
          npm run test:unit -- --run
        continue-on-error: true

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(muapi): sync catalog - ${{ needs.sync.outputs.added }} added, ${{ needs.sync.outputs.removed }} removed"
          title: "🔄 MUAPI Catalog Sync: ${{ needs.sync.outputs.added }} new, ${{ needs.sync.outputs.removed }} removed"
          body: |
            ## Automated MUAPI Catalog Sync
            
            This PR was automatically generated by the MUAPI sync workflow.
            
            ### Changes Detected
            
            | Type | Count |
            |------|-------|
            | 🟢 Added | ${{ needs.sync.outputs.added }} |
            | 🔴 Removed | ${{ needs.sync.outputs.removed }} |
            | 🟡 Modified | ${{ needs.sync.outputs.modified }} |
            
            ### Verification
            
            - [x] Catalog fetched successfully
            - [x] models.js updated with new entries
            - [x] Verification script passed
            - [ ] Integration tests passed (check status)
            
            ### Review Checklist
            
            - [ ] Review new model entries for correctness
            - [ ] Verify endpoint mappings are accurate
            - [ ] Test new models in staging environment
            - [ ] Confirm no breaking changes
            
            ---
            *Generated at ${{ github.event.schedule || 'manual trigger' }}*
          branch: muapi-sync/${{ github.run_number }}
          delete-branch: true
          labels: |
            automated
            muapi-sync
            catalog-update

      - name: PR created
        if: steps.cpr.outputs.pull-request-number
        run: |
          echo "✅ PR created: ${{ steps.cpr.outputs.pull-request-url }}"

  # ─── Job 3: Health check report ──────────────────────────────────────────
  health-report:
    name: Endpoint Health Report
    needs: sync
    if: github.event.inputs.health_check != 'false'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download catalog artifacts
        uses: actions/download-artifact@v4
        with:
          name: catalog-${{ github.run_number }}
          path: catalogs/

      - name: Run health check
        run: |
          node scripts/muapi-catalog-sync.mjs --health-check 2>&1 | tee health-report.log

      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: health-report-${{ github.run_number }}
          path: health-report.log
          retention-days: 7

  # ─── Job 4: Create GitHub Issue for critical changes ──────────────────────
  critical-alert:
    name: Critical Change Alert
    needs: [sync, create-pr]
    if: needs.sync.outputs.added > 5 || needs.sync.outputs.removed > 10
    runs-on: ubuntu-latest
    
    steps:
      - name: Create GitHub Issue for critical changes
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Major MUAPI Update: ${{ needs.sync.outputs.added }} new models`,
              body: `A significant update to the MUAPI catalog was detected.\n\n**New models:** ${{ needs.sync.outputs.added }}\n**Removed:** ${{ needs.sync.outputs.removed }}\n**Modified:** ${{ needs.sync.outputs.modified }}\n\nPlease review the sync PR for details.`,
              labels: ['muapi-sync', 'priority-high', 'automated']
            })
