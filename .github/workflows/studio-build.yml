name: Studio Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-workspaces:
    name: Build workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/*/package.json
            apps/*/package.json
            apps/*/*/package.json
            packages/*/*/package.json
            packages/*/*/*/package.json

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Install dependencies (npm ci, fallback to install)
        run: |
          if npm ci --no-audit --prefer-offline; then
            echo "npm ci succeeded"
          else
            echo "npm ci failed, falling back to npm install"
            npm install --no-audit --prefer-offline
          fi

      - name: Build workspace packages
        run: npm run build:packages

      - name: Upload studio dist
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: studio-dist-${{ github.run_id }}
          path: |
            packages/studio/dist
            packages/studio/build
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload design-agent dist
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: design-agent-dist-${{ github.run_id }}
          path: |
            packages/Open-AI-Design-Agent/packages/design-agent/dist
          if-no-files-found: ignore
          retention-days: 7
