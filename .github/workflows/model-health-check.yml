name: Model Health Check

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  MUAPI_BASE: 'https://api.muapi.ai/api/v1'

jobs:
  health-check:
    name: Check Model Endpoints
    runs-on: ubuntu-latest
    outputs:
      has-failures: ${{ steps.check.outputs.has-failures }}
      report-path: ${{ steps.check.outputs.report-path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run health check
        id: check
        run: |
          # Run the health monitor script
          node scripts/muapi-health-monitor.mjs --report 2>&1 | tee health-check-output.log

          # Check if monitoring directory has results
          if [ -f monitoring/endpoint-status.json ]; then
            # Parse results
            FAILED=$(node -e "
              const report = JSON.parse(require('fs').readFileSync('monitoring/endpoint-status.json', 'utf8'));
              console.log(report.summary.failed);
            " 2>/dev/null || echo "0")

            TOTAL=$(node -e "
              const report = JSON.parse(require('fs').readFileSync('monitoring/endpoint-status.json', 'utf8'));
              console.log(report.summary.total);
            " 2>/dev/null || echo "0")

            echo "Failed endpoints: ${FAILED}/${TOTAL}"

            if [ "${FAILED}" -gt 0 ]; then
              echo "has-failures=true" >> $GITHUB_OUTPUT
            else
              echo "has-failures=false" >> $GITHUB_OUTPUT
            fi

            echo "report-path=monitoring/endpoint-status.json" >> $GITHUB_OUTPUT
          else
            echo "No health report generated"
            echo "has-failures=false" >> $GITHUB_OUTPUT
            echo "report-path=" >> $GITHUB_OUTPUT
          fi

      - name: Upload health report
        if: steps.check.outputs.has-failures == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: health-report-${{ github.run_number }}
          path: |
            monitoring/
            health-check-output.log
          retention-days: 30

  create-issue:
    name: Create Issue for Failures
    needs: health-check
    if: needs.health-check.outputs.has-failures == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download health report
        uses: actions/download-artifact@v4
        with:
          name: health-report-${{ github.run_number }}
          path: monitoring/

      - name: Generate issue body
        id: issue-body
        run: |
          # Parse the health report and generate issue body
          node -e "
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('monitoring/endpoint-status.json', 'utf8'));

            const s = report.summary;
            let body = '## Model Endpoint Health Check Report\n\n';
            body += '**Date:** ' + report.timestamp + '\n';
            body += '**Duration:** ' + (report.duration / 1000).toFixed(1) + 's\n\n';

            body += '### Summary\n\n';
            body += '| Metric | Count |\n';
            body += '|--------|-------|\n';
            body += '| Total Endpoints | ' + s.total + ' |\n';
            body += '| ✅ Healthy | ' + s.healthy + ' (' + s.healthyPercent + '%) |\n';
            body += '| ❌ Failed | ' + s.failed + ' |\n';
            body += '| 🔍 Not Found | ' + s.notFound + ' |\n';
            body += '| ⏱️ Timeouts | ' + s.timeouts + ' |\n';
            body += '| ⚡ Avg Response | ' + s.avgResponseTime + 'ms |\n\n';

            if (report.failures.length > 0) {
              body += '### Failed Endpoints\n\n';
              body += '| Model | Endpoint | Status | Error |\n';
              body += '|-------|----------|--------|-------|\n';
              for (const f of report.failures) {
                body += '| ' + f.name + ' | `' + f.endpoint + '` | ' + f.status + ' | ' + (f.error || f.httpStatus || '-') + ' |\n';
              }
              body += '\n';
            }

            // Find changed endpoints (compare with previous report if exists)
            body += '### Changed Endpoints\n\n';
            const prevFile = 'monitoring/endpoint-status-prev.json';
            if (fs.existsSync(prevFile)) {
              const prev = JSON.parse(fs.readFileSync(prevFile, 'utf8'));
              const prevMap = new Map(prev.endpoints.map(e => [e.endpoint, e]));
              const changes = [];

              for (const ep of report.endpoints) {
                const prevEp = prevMap.get(ep.endpoint);
                if (prevEp && prevEp.status !== ep.status) {
                  changes.push({
                    name: ep.name,
                    endpoint: ep.endpoint,
                    before: prevEp.status,
                    after: ep.status,
                  });
                }
              }

              if (changes.length > 0) {
                body += '| Model | Endpoint | Before | After |\n';
                body += '|-------|----------|--------|-------|\n';
                for (const c of changes) {
                  body += '| ' + c.name + ' | `' + c.endpoint + '` | ' + c.before + ' | ' + c.after + ' |\n';
                }
                body += '\n';
              } else {
                body += 'No endpoint status changes since last check.\n\n';
              }
            } else {
              body += 'No previous report available for comparison.\n\n';
            }

            body += '### Actions Required\n\n';
            body += '- [ ] Investigate failed endpoints\n';
            body += '- [ ] Verify endpoint URLs are correct\n';
            body += '- [ ] Check MuAPI service status\n';
            body += '- [ ] Update models.js if endpoints changed\n';
            body += '\n---\n';
            body += '*This issue was automatically generated by the Model Health Check workflow.*\n';

            fs.writeFileSync('/tmp/issue-body.md', body);
            console.log('Issue body generated');
          "

      - name: Create GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/issue-body.md', 'utf8');

            // Check for existing open health issues
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'model-health,automated',
              state: 'open',
            });

            if (existingIssues.length > 0) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssues[0].number,
                body: body,
              });
              console.log(`Updated existing issue #${existingIssues[0].number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🏥 Model Health Check: Endpoint Issues Detected`,
                body: body,
                labels: ['model-health', 'automated', 'bug'],
              });
              console.log('Created new issue');
            }

      - name: Save current report for next comparison
        run: |
          if [ -f monitoring/endpoint-status.json ]; then
            cp monitoring/endpoint-status.json monitoring/endpoint-status-prev.json
          fi
