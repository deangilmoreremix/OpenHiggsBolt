name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test, build (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20]

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/*/package.json
            apps/*/package.json
            apps/*/*/package.json
            packages/*/*/package.json
            packages/*/*/*/package.json

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Install dependencies (npm ci, fallback to install)
        run: |
          if npm ci --no-audit --prefer-offline; then
            echo "npm ci succeeded"
          else
            echo "npm ci failed, falling back to npm install"
            npm install --no-audit --prefer-offline
          fi

      - name: Run setup (submodule build)
        run: npm run setup || true

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run VFX tests
        run: npm run test:vfx

      - name: Build Next.js
        id: build
        run: npm run build
        continue-on-error: true
        if: always()

      - name: Upload .next build artifact on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.run_id }}
          path: .next/
          if-no-files-found: ignore
          retention-days: 3
