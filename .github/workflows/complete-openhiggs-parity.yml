name: Complete OpenHiggsBolt Parity

on:
  push:
    branches:
      - parity/upstream-full-2026-09-02

permissions:
  contents: write

jobs:
  finish-parity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout parity branch
        uses: actions/checkout@v4
        with:
          ref: parity/upstream-full-2026-09-02
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Apply final scoped parity changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # ------------------------------------------------------------------
          # Product scope: Apps Studio / Explore Apps and MCP/CLI are excluded.
          # ------------------------------------------------------------------
          shell = Path('components/StandaloneShell.js')
          shell_text = shell.read_text()
          for needle in (
              "const AppsStudio = loadStudio('AppsStudio');\n",
              "  { id: 'apps', label: 'Explore Apps' },\n",
              "  apps: 'apps',\n",
              "         {activeTab === 'apps' && <AppsStudio apiKey={apiKey} locale={locale} />}\n",
          ):
              if needle not in shell_text:
                  raise SystemExit(f'Missing expected Apps shell wiring: {needle!r}')
              shell_text = shell_text.replace(needle, '', 1)
          shell.write_text(shell_text)

          index_path = Path('packages/studio/src/index.js')
          index_text = index_path.read_text()
          apps_export = "export { default as AppsStudio } from './components/AppsStudio';\n"
          if apps_export not in index_text:
              raise SystemExit('AppsStudio export was not found')
          index_path.write_text(index_text.replace(apps_export, '', 1))

          locale_path = Path('components/LocaleTextBridge.js')
          locale_text = locale_path.read_text()
          for needle in (
              "import enApps from '../packages/studio/src/messages/en/appsStudio.json';\n",
              "import zhApps from '../packages/studio/src/messages/zh/appsStudio.json';\n",
              "  [enApps, zhApps],\n",
          ):
              if needle not in locale_text:
                  raise SystemExit(f'Missing Apps locale wiring: {needle!r}')
              locale_text = locale_text.replace(needle, '', 1)
          locale_path.write_text(locale_text)

          for path in ('messages/en/common.json', 'messages/zh/common.json'):
              p = Path(path)
              data = json.loads(p.read_text())
              data.get('tabs', {}).pop('apps', None)
              data.get('tabs', {}).pop('mcp-cli', None)
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          for path in (
              'packages/studio/src/components/AppsStudio.jsx',
              'packages/studio/src/messages/en/appsStudio.json',
              'packages/studio/src/messages/zh/appsStudio.json',
          ):
              p = Path(path)
              if p.exists():
                  p.unlink()

          Path('app/studio/apps').mkdir(parents=True, exist_ok=True)
          Path('app/studio/apps/page.js').write_text("""import { redirect } from 'next/navigation';

export default function AppsRedirect() {
  redirect('/studio/image');
}
""")
          Path('app/zh/studio/apps').mkdir(parents=True, exist_ok=True)
          Path('app/zh/studio/apps/page.js').write_text("""import { redirect } from 'next/navigation';

export default function ZhAppsRedirect() {
  redirect('/zh/studio/image');
}
""")

          # ------------------------------------------------------------------
          # Keep future upstream syncs from restoring excluded product surfaces.
          # ------------------------------------------------------------------
          sync_path = Path('.github/workflows/upstream-sync.yml')
          sync = sync_path.read_text()
          anchor = "            packages/studio/src/persistKey.js \\\n"
          restore_lines = """            components/StandaloneShell.js \\
            components/LocaleTextBridge.js \\
            messages/en/common.json \\
            messages/zh/common.json \\
            packages/studio/src/index.js \\
            app/studio/apps/ \\
            app/zh/studio/apps/ \\
            app/studio/mcp-cli/ \\
            app/zh/studio/mcp-cli/ \\
"""
          if '            components/StandaloneShell.js \\\n' not in sync:
              if anchor not in sync:
                  raise SystemExit('Unable to locate upstream-sync restore anchor')
              sync = sync.replace(anchor, anchor + restore_lines, 1)

          marker = "            2>/dev/null || true\n\n      - name: Check for conflicts"
          exclusion_block = """            2>/dev/null || true

          # SmartVideo GO scope exclusions. These upstream product surfaces are
          # intentionally not part of OpenHiggsBolt and must never be restored.
          rm -f \\
            packages/studio/src/components/AppsStudio.jsx \\
            packages/studio/src/messages/en/appsStudio.json \\
            packages/studio/src/messages/zh/appsStudio.json \\
            packages/studio/src/components/McpCliStudio.jsx \\
            packages/studio/src/messages/en/mcpCliStudio.json \\
            packages/studio/src/messages/zh/mcpCliStudio.json \\
            2>/dev/null || true

          WHITE_LABEL_PATHS=$(git ls-files | grep -Ei '(^|/)(white[-_]?label|whitelabel)(/|\\.|$)' || true)
          if [ -n "$WHITE_LABEL_PATHS" ]; then
            echo "$WHITE_LABEL_PATHS" | while IFS= read -r path; do
              git rm -rf --ignore-unmatch "$path"
            done
          fi

          # The active SmartVideo shell and Design Agent must never gain tenant/
          # white-label product logic through an automated upstream merge.
          if git grep -niEi 'white[-_ ]?label|whitelabel' -- components/StandaloneShell.js src/apps/design-agent app/api/design-agent 2>/dev/null; then
            echo "::error::White-label logic detected in active SmartVideo product code."
            exit 1
          fi

      - name: Check for conflicts"""
          if 'SmartVideo GO scope exclusions' not in sync:
              if marker not in sync:
                  raise SystemExit('Unable to locate upstream-sync exclusion insertion point')
              sync = sync.replace(marker, exclusion_block, 1)
          sync_path.write_text(sync)

          # ------------------------------------------------------------------
          # Design Agent parity: preserve SmartVideo UI; add upstream capabilities.
          # ------------------------------------------------------------------
          design_path = Path('src/apps/design-agent/DesignAgent.tsx')
          design = design_path.read_text()

          if "import axios from 'axios'" not in design:
              replace_once(
                  design_path,
                  "import { useState, useEffect, useRef, useCallback, useMemo } from 'react'\n",
                  "import { useState, useEffect, useRef, useCallback, useMemo } from 'react'\nimport axios from 'axios'\n",
              )
              design = design_path.read_text()

          replace_once(
              design_path,
              "function AssetModal({ asset, onClose }: { asset: Asset; onClose: () => void }) {",
              "function AssetModal({ asset, onClose, onAction }: { asset: Asset; onClose: () => void; onAction: (action: 'edit' | 'upscale' | 'remove-bg' | 'vectorize', asset: Asset) => void }) {",
          )
          design = design_path.read_text()

          asset_action_anchor = """            <a href={asset.url} download target=\"_blank\" rel=\"noopener noreferrer\" className=\"px-4 py-2 rounded-lg text-sm font-medium transition-all\" style={{ background: 'var(--color-primary)', color: 'white' }}>
              Download
            </a>
"""
          asset_actions = """            {asset.type === 'image' && (
              <>
                <button onClick={() => onAction('edit', asset)} className=\"px-3 py-2 rounded-lg text-xs font-medium\" style={{ background: 'var(--bg-page)', color: 'var(--text-primary)', border: '1px solid var(--border-color)' }}>Edit with Go-AI</button>
                <button onClick={() => onAction('upscale', asset)} className=\"px-3 py-2 rounded-lg text-xs font-medium\" style={{ background: 'var(--bg-page)', color: 'var(--text-primary)', border: '1px solid var(--border-color)' }}>Upscale</button>
                <button onClick={() => onAction('remove-bg', asset)} className=\"px-3 py-2 rounded-lg text-xs font-medium\" style={{ background: 'var(--bg-page)', color: 'var(--text-primary)', border: '1px solid var(--border-color)' }}>Remove BG</button>
                <button onClick={() => onAction('vectorize', asset)} className=\"px-3 py-2 rounded-lg text-xs font-medium\" style={{ background: 'var(--bg-page)', color: 'var(--text-primary)', border: '1px solid var(--border-color)' }}>Vectorize</button>
              </>
            )}
            <a href={asset.url} download target=\"_blank\" rel=\"noopener noreferrer\" className=\"px-4 py-2 rounded-lg text-sm font-medium transition-all\" style={{ background: 'var(--color-primary)', color: 'white' }}>
              Download
            </a>
"""
          design = design_path.read_text()
          if "onAction('vectorize'" not in design:
              if asset_action_anchor not in design:
                  raise SystemExit('Asset modal action anchor not found')
              design_path.write_text(design.replace(asset_action_anchor, asset_actions, 1))

          design = design_path.read_text()
          if 'interface AgentAttachment' not in design:
              interface_anchor = """interface Message {
  id: string
  role: 'user' | 'assistant'
  content: string
  assets?: Asset[]
  createdAt: string
}
"""
              interface_block = """interface AgentAttachment {
  asset_label: string
  url: string
  kind: 'image' | 'video' | 'audio'
}

interface PendingPlan {
  jobId: string
  sessionId: string
  title: string
  nodes: Array<{ id?: string | number; label?: string; tool?: string; depends?: Array<string | number>; est_credits?: number }>
  totalCredits: number
}

interface BrandKit {
  enabled: boolean
  logo: string
  colors: string
  fonts: string
  tone: string
  style: string
}

interface Message {
  id: string
  role: 'user' | 'assistant'
  content: string
  assets?: Asset[]
  attachments?: AgentAttachment[]
  createdAt: string
}
"""
              if interface_anchor not in design:
                  raise SystemExit('Design Agent Message interface anchor not found')
              design_path.write_text(design.replace(interface_anchor, interface_block, 1))

          design = design_path.read_text()
          state_anchor = "  const [selectedAsset, setSelectedAsset] = useState<Asset | null>(null)\n"
          state_block = """  const [selectedAsset, setSelectedAsset] = useState<Asset | null>(null)
  const [attachments, setAttachments] = useState<AgentAttachment[]>([])
  const [uploading, setUploading] = useState(false)
  const [uploadProgress, setUploadProgress] = useState(0)
  const [pendingPlan, setPendingPlan] = useState<PendingPlan | null>(null)
  const [activity, setActivity] = useState<Array<{ label: string; status: 'running' | 'done' | 'error' }>>([])
  const [agentMode, setAgentMode] = useState<'agent' | 'generate' | 'edit'>('agent')
  const [showBrandKit, setShowBrandKit] = useState(false)
  const [brandKit, setBrandKit] = useState<BrandKit>(() => {
    if (typeof window === 'undefined') return { enabled: false, logo: '', colors: '', fonts: '', tone: '', style: '' }
    try {
      return JSON.parse(localStorage.getItem(LOCAL_KEY + '_brand_kit') || 'null') || { enabled: false, logo: '', colors: '', fonts: '', tone: '', style: '' }
    } catch {
      return { enabled: false, logo: '', colors: '', fonts: '', tone: '', style: '' }
    }
  })
"""
          if 'const [pendingPlan, setPendingPlan]' not in design:
              if state_anchor not in design:
                  raise SystemExit('Design Agent state anchor not found')
              design_path.write_text(design.replace(state_anchor, state_block, 1))

          design = design_path.read_text()
          ref_anchor = "  const fileInputRef = useRef<HTMLInputElement>(null)\n"
          if 'approvedJobsRef' not in design:
              replace_once(design_path, ref_anchor, ref_anchor + "  const approvedJobsRef = useRef(new Set<string>())\n")

          design = design_path.read_text()
          persist_anchor = "  useEffect(() => { saveProjects(projects) }, [projects])\n"
          if "_brand_kit" not in design.split(persist_anchor, 1)[-1][:500]:
              replace_once(
                  design_path,
                  persist_anchor,
                  persist_anchor + "  useEffect(() => {\n    if (typeof window !== 'undefined') localStorage.setItem(LOCAL_KEY + '_brand_kit', JSON.stringify(brandKit))\n  }, [brandKit])\n",
              )

          design = design_path.read_text()
          send_anchor = "  const sendMessage = useCallback(async () => {\n"
          if 'const ensureAttachmentProject' not in design:
              helper_block = """  const ensureAttachmentProject = useCallback(async (): Promise<Project | null> => {
    if (activeProject) return activeProject
    if (!apiKey) { onRequestApiKey?.(); return null }
    try {
      const session = await apiCall('/api/design-agent/sessions', {
        method: 'POST',
        body: JSON.stringify({ name: `Project ${projects.length + 1}` }),
      }, apiKey)
      const project: Project = {
        id: session.id || session.session_id || Date.now().toString(),
        name: session.name || `Project ${projects.length + 1}`,
        createdAt: new Date().toISOString(),
        messageCount: 0,
      }
      setProjects(prev => [project, ...prev])
      setActiveProject(project)
      setMessages([])
      return project
    } catch (err: any) {
      setActivity([{ label: err?.message || 'Could not create a Design Agent project', status: 'error' }])
      return null
    }
  }, [activeProject, apiKey, onRequestApiKey, projects.length])

  const handleAttachmentFiles = useCallback(async (fileList: FileList | null) => {
    const files = Array.from(fileList || []).slice(0, Math.max(0, 14 - attachments.length))
    if (!files.length) return
    const project = await ensureAttachmentProject()
    if (!project) return

    setUploading(true)
    setUploadProgress(0)
    try {
      for (const file of files) {
        const kind: AgentAttachment['kind'] = file.type.startsWith('video/') ? 'video' : file.type.startsWith('audio/') ? 'audio' : 'image'
        if (!file.type.startsWith('image/') && !file.type.startsWith('video/') && !file.type.startsWith('audio/')) continue

        const sign = await axios.get('/api/v1/get_upload_url', {
          params: { filename: file.name },
          headers: { 'x-api-key': apiKey },
        })
        const { url, fields } = sign.data || {}
        if (!url || !fields?.key) throw new Error('Upload URL was not returned')

        const formData = new FormData()
        formData.append('x-proxy-target-url', url)
        Object.entries(fields).forEach(([key, value]) => formData.append(key, String(value)))
        formData.append('file', file)
        await axios.post('/api/v1/upload-binary', formData, {
          headers: { 'Content-Type': 'multipart/form-data' },
          onUploadProgress: (event) => {
            if (event.total) setUploadProgress(Math.round((event.loaded * 100) / event.total))
          },
        })

        const uploadedUrl = `https://cdn.muapi.ai/${fields.key}`
        const registered = await apiCall('/api/design-agent/session-assets', {
          method: 'POST',
          body: JSON.stringify({ sessionId: project.id, url: uploadedUrl, kind }),
        }, apiKey)
        const attachment: AgentAttachment = {
          asset_label: registered.asset_label || registered.id || `asset_${Date.now()}`,
          url: uploadedUrl,
          kind,
        }
        setAttachments(prev => [...prev, attachment].slice(0, 14))
      }
    } catch (err: any) {
      setActivity(prev => [...prev, { label: err?.message || 'Reference upload failed', status: 'error' }].slice(-8))
    } finally {
      setUploading(false)
      setUploadProgress(0)
    }
  }, [apiKey, attachments.length, ensureAttachmentProject])

  const removeAttachment = useCallback((label: string) => {
    setAttachments(prev => prev.filter(item => item.asset_label !== label))
  }, [])

  const handleAssetAction = useCallback((action: 'edit' | 'upscale' | 'remove-bg' | 'vectorize', asset: Asset) => {
    if (asset.type !== 'image') return
    setAgentMode('edit')
    setAttachments([{ asset_label: asset.id, url: asset.url, kind: 'image' }])
    const prompts = {
      edit: 'Edit this image: ',
      upscale: 'Upscale this image to the highest practical quality while preserving the original design.',
      'remove-bg': 'Remove the background from this image and return a clean transparent-background result.',
      vectorize: 'Vectorize this image and return a clean scalable logo/illustration result.',
    }
    setInput(prompts[action])
    setSelectedAsset(null)
  }, [])

"""
              if send_anchor not in design:
                  raise SystemExit('sendMessage anchor not found')
              design_path.write_text(design.replace(send_anchor, helper_block + send_anchor, 1))

          design = design_path.read_text()
          if "attachments.length === 0" not in design:
              design = design.replace(
                  "    if (!input.trim() && !selectedTemplate) return\n",
                  "    if (!input.trim() && !selectedTemplate && attachments.length === 0) return\n",
                  1,
              )
              old_user_content = "    const userContent = selectedTemplate ? `[${selectedTemplate.label}] ${input}` : input\n"
              new_user_content = """    const attachmentSnapshot = [...attachments]
    const attachmentNote = attachmentSnapshot.length
      ? `\\n\\n[Attached ${attachmentSnapshot.map(item => `${item.asset_label} (${item.kind})`).join(', ')}]`
      : ''
    const brandNote = brandKit.enabled
      ? `\\n\\n[Brand Kit — logo: ${brandKit.logo || 'not set'}; colors: ${brandKit.colors || 'not set'}; fonts: ${brandKit.fonts || 'not set'}; tone: ${brandKit.tone || 'not set'}; style: ${brandKit.style || 'not set'}]`
      : ''
    const modeNote = `\\n\\n[Mode: ${agentMode}]`
    const visibleInput = input.trim() || (attachmentSnapshot.length ? 'Use the attached references.' : '')
    const agentInput = `${visibleInput}${attachmentNote}${brandNote}${modeNote}`.trim()
    const userContent = selectedTemplate ? `[${selectedTemplate.label}] ${visibleInput}` : visibleInput
"""
              if old_user_content not in design:
                  raise SystemExit('userContent anchor not found')
              design = design.replace(old_user_content, new_user_content, 1)
              design = design.replace(
                  "      content: userContent,\n      createdAt: new Date().toISOString(),\n",
                  "      content: userContent,\n      attachments: attachmentSnapshot,\n      createdAt: new Date().toISOString(),\n",
                  1,
              )
              design = design.replace(
                  "    setMessages(prev => [...prev, userMsg])\n    setInput('')\n    setSelectedTemplate(null)\n",
                  "    setMessages(prev => [...prev, userMsg])\n    setInput('')\n    setAttachments([])\n    setSelectedTemplate(null)\n",
                  1,
              )
              design = design.replace("            message: input,\n", "            message: agentInput,\n", 1)
              design = design.replace(
                  "            messages_snapshot: [...prior, { role: 'user', content: userContent }],\n",
                  "            messages_snapshot: [...prior, { role: 'user', content: agentInput }],\n",
                  1,
              )
              design = design.replace(
                  "  }, [input, selectedTemplate, apiKey, activeProject, messages, createNewProject])\n",
                  "  }, [input, selectedTemplate, apiKey, activeProject, messages, createNewProject, attachments, brandKit, agentMode])\n",
                  1,
              )
              design_path.write_text(design)

          design = design_path.read_text()
          auto_approve = """        } else if (ev?.type === 'plan_propose') {
          // No plan-approval UI — approve automatically so generation proceeds.
          try {
            await apiCall('/api/design-agent/approve', {
              method: 'POST',
              body: JSON.stringify({ jobId }),
            }, apiKey)
          } catch { /* already approved / not required */ }
        } else if (ev?.type === 'tool_result' && ev?.payload?.asset) {
          streamedAssets.push(mapAsset(ev.payload.asset))
"""
          plan_control = """        } else if (ev?.type === 'plan_propose') {
          if (!approvedJobsRef.current.has(jobId)) {
            setPendingPlan({
              jobId,
              sessionId,
              title: ev?.payload?.title || 'Go-AI execution plan',
              nodes: Array.isArray(ev?.payload?.nodes) ? ev.payload.nodes : [],
              totalCredits: Number(ev?.payload?.total_credits || 0),
            })
            setActivity(prev => [...prev, { label: 'Plan ready for approval', status: 'running' }].slice(-8))
            return
          }
        } else if (ev?.type === 'tool_call') {
          const toolName = String(ev?.payload?.name || 'AI tool').replace(/_/g, ' ')
          setActivity(prev => [...prev.filter(item => item.label !== toolName), { label: toolName, status: 'running' }].slice(-8))
        } else if (ev?.type === 'tool_result') {
          const toolName = String(ev?.payload?.name || 'AI tool').replace(/_/g, ' ')
          setActivity(prev => [...prev.filter(item => item.label !== toolName), { label: toolName, status: 'done' }].slice(-8))
          if (ev?.payload?.asset) streamedAssets.push(mapAsset(ev.payload.asset))
"""
          if auto_approve in design:
              design_path.write_text(design.replace(auto_approve, plan_control, 1))
          elif 'No plan-approval UI' in design:
              raise SystemExit('Design Agent auto-approval block changed unexpectedly')

          design = design_path.read_text()
          delete_anchor = "  const deleteProject = useCallback((id: string) => {\n"
          if 'const handlePlanAction' not in design:
              plan_handler = """  const handlePlanAction = useCallback(async (action: 'approve' | 'reject') => {
    if (!pendingPlan) return
    const plan = pendingPlan
    setIsLoading(true)
    try {
      if (action === 'approve') {
        await apiCall('/api/design-agent/approve', {
          method: 'POST',
          body: JSON.stringify({ jobId: plan.jobId }),
        }, apiKey)
        approvedJobsRef.current.add(plan.jobId)
        setPendingPlan(null)
        setActivity(prev => [...prev, { label: 'Plan approved — executing', status: 'running' }].slice(-8))
        await pollJob(plan.jobId, plan.sessionId)
      } else {
        await apiCall('/api/design-agent/reject', {
          method: 'POST',
          body: JSON.stringify({ jobId: plan.jobId }),
        }, apiKey)
        setPendingPlan(null)
        setActivity(prev => [...prev, { label: 'Plan rejected — ready for revisions', status: 'done' }].slice(-8))
        setInput('Revise the plan: ')
      }
    } catch (err: any) {
      setActivity(prev => [...prev, { label: err?.message || `Could not ${action} plan`, status: 'error' }].slice(-8))
    } finally {
      setIsLoading(false)
    }
  }, [pendingPlan, apiKey, pollJob])

"""
              if delete_anchor not in design:
                  raise SystemExit('deleteProject anchor not found')
              design_path.write_text(design.replace(delete_anchor, plan_handler + delete_anchor, 1))

          design = design_path.read_text()
          # Keep one global input mounted so both home and active-project composers
          # can use the same reference uploader.
          old_hidden_input = "                <input ref={fileInputRef} type=\"file\" className=\"hidden\" accept=\"image/*,video/*\" />\n"
          if old_hidden_input in design:
              design = design.replace(old_hidden_input, '', 1)

          outer_anchor = """      <div className=\"flex flex-col h-full\" style={appWrapper}>
        {showTemplates && (
"""
          parity_controls = """      <div className=\"flex flex-col h-full\" style={appWrapper}>
        <input
          ref={fileInputRef}
          type=\"file\"
          className=\"hidden\"
          accept=\"image/*,video/*,audio/*\"
          multiple
          onChange={event => { handleAttachmentFiles(event.currentTarget.files); event.currentTarget.value = '' }}
        />

        <div className=\"flex flex-wrap items-center justify-end gap-2 px-8 pt-2\">
          {(['agent', 'generate', 'edit'] as const).map(mode => (
            <button key={mode} onClick={() => setAgentMode(mode)} className=\"px-3 py-1.5 rounded-full text-xs font-medium capitalize transition-all\" style={{ background: agentMode === mode ? 'rgba(59,130,246,0.2)' : 'var(--bg-card)', border: '1px solid var(--border-color)', color: agentMode === mode ? '#60a5fa' : semantic.textSecondary }}>{mode}</button>
          ))}
          <button onClick={() => setShowBrandKit(true)} className=\"px-3 py-1.5 rounded-full text-xs font-medium transition-all\" style={{ background: brandKit.enabled ? 'rgba(34,197,94,0.12)' : 'var(--bg-card)', border: '1px solid var(--border-color)', color: brandKit.enabled ? '#86efac' : semantic.textSecondary }}>Brand Kit</button>
        </div>

        {(attachments.length > 0 || uploading || activity.length > 0) && (
          <div className=\"mx-8 mt-2 flex flex-wrap items-center gap-2 rounded-xl p-2\" style={{ background: 'rgba(255,255,255,0.025)', border: '1px solid var(--border-color)' }}>
            {attachments.map(item => (
              <div key={item.asset_label} className=\"flex items-center gap-2 rounded-lg px-2 py-1 text-xs\" style={{ background: 'var(--bg-card)' }}>
                <span>{item.kind === 'video' ? '🎬' : item.kind === 'audio' ? '🎵' : '🖼️'}</span>
                <span>{item.asset_label}</span>
                <button onClick={() => removeAttachment(item.asset_label)} aria-label={`Remove ${item.asset_label}`}><X size={11} /></button>
              </div>
            ))}
            {uploading && <div className=\"text-xs\" style={{ color: semantic.textSecondary }}>Uploading reference… {uploadProgress}%</div>}
