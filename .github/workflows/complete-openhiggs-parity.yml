      - name: Static scope assertions
        run: |
          set -e
          ! grep -q "AppsStudio" components/StandaloneShell.js
          ! grep -q "AppsStudio" packages/studio/src/index.js
          ! grep -qiE "white[-_ ]?label|whitelabel" components/StandaloneShell.js
          ! grep -qiE "white[-_ ]?label|whitelabel" src/apps/design-agent/DesignAgent.tsx
          grep -q "GO-AI EXECUTION PLAN" src/apps/design-agent/DesignAgent.tsx
          grep -q "session-assets" src/apps/design-agent/DesignAgent.tsx
          grep -q "Start & End Frames" packages/studio/src/videoWorkflows.js

      - name: Commit completed parity implementation
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No parity changes to commit"
          else
            git commit -m "feat(parity): finish scoped upstream parity"
            git push origin HEAD:parity/upstream-full-2026-09-02
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run parity regression tests
        run: npm run test:unit -- --run components/StandaloneShell.scope.test.js src/apps/design-agent/DesignAgent.parity.test.js packages/studio/src/videoWorkflows.test.js

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint signal
        continue-on-error: true
        run: npm run lint

      - name: Remove temporary parity-finisher workflow
        if: success()
        run: |
          git rm .github/workflows/complete-openhiggs-parity.yml
          git commit -m "chore(parity): remove temporary completion workflow"
          git push origin HEAD:parity/upstream-full-2026-09-02
