name: SmartVideo GO Marketing Screenshot Inventory

on:
  workflow_dispatch:

jobs:
  capture:
    name: Capture and certify current marketing screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Initialize required package submodules
        shell: bash
        run: |
          git submodule update --init \
            packages/Open-AI-Design-Agent \
            packages/Open-Poe-AI \
            packages/Vibe-Workflow

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture and certify screenshot inventory
        run: npm run marketing:screenshots

      - name: Upload current marketing screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartvideo-go-marketing-screenshot-inventory
          path: visual-assets/marketing-current/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smartvideo-go-marketing-screenshot-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
