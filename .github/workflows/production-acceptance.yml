name: Production Studio Acceptance Tests

on:
  workflow_dispatch:
    inputs:
      run_paid_tests:
        description: 'Run paid generation tests (consumes provider credits)'
        required: false
        default: 'false'
        type: boolean
  push:
    branches:
      - main

jobs:
  production-acceptance:
    name: Production Studio Acceptance
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://go.smartvid.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run production studio acceptance tests
        run: npx playwright test e2e/studio-production-acceptance.spec.ts --config=playwright.production.config.ts --reporter=html
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          CLERK_TESTING_TOKEN: ${{ secrets.CLERK_TESTING_TOKEN }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_SECRET_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_SECRET_KEY }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Upload authentication state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-auth-state
          path: playwright/.auth/
          retention-days: 7
